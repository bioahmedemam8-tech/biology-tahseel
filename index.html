    let currentSubject = 'all';
    let currentLesson = 'all';
    let score = 0;
    let answered = 0;
    const letters = ['أ', 'ب', 'ج', 'د'];

    function shuffleArray(array) {
        const arr = array.map((item, idx) => ({ text: item, isCorrect: idx === 0 }));
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function renderLessonButtons() {
        const lessonContainer = document.getElementById('lesson-filters');
        if (currentSubject === 'all') {
            lessonContainer.classList.remove('show');
            lessonContainer.innerHTML = '';
            return;
        }

        const subjectQuestions = questionsBank.filter(q => q.subject === currentSubject);
        const lessons = [...new Set(subjectQuestions.map(q => q.lesson).filter(Boolean))];

        if (lessons.length === 0) {
            lessonContainer.classList.remove('show');
            lessonContainer.innerHTML = '';
            return;
        }

        let html = `<button class="lesson-btn ${currentLesson === 'all' ? 'active' : ''}" onclick="filterByLesson('all', this)">كل الدروس (${subjectQuestions.length})</button>`;
        lessons.forEach(lesson => {
            const count = subjectQuestions.filter(q => q.lesson === lesson).length;
            const isActive = currentLesson === lesson ? 'active' : '';
            html += `<button class="lesson-btn ${isActive}" onclick="filterByLesson('${lesson}', this)">${lesson} (${count})</button>`;
        });

        lessonContainer.innerHTML = html;
        lessonContainer.classList.add('show');
    }

    function renderQuestions() {
        const container = document.getElementById('questions-container');
        container.innerHTML = '';
        score = 0;
        answered = 0;
        updateStats();

        let filtered = currentSubject === 'all'
            ? questionsBank
            : questionsBank.filter(q => q.subject === currentSubject);

        if (currentSubject !== 'all' && currentLesson !== 'all') {
            filtered = filtered.filter(q => q.lesson === currentLesson);
        }

        document.getElementById('total-count').textContent = filtered.length;

        if (filtered.length === 0) {
            container.innerHTML = '<div class="question-card" style="text-align:center; color:var(--text-muted);">جاري رفع أسئلة هذا المقرر قريباً...</div>';
            return;
        }

        filtered.forEach((q, qIndex) => {
            const card = document.createElement('div');
            card.className = 'question-card';

            const shuffledOptions = shuffleArray(q.options);

            let optionsHTML = '';
            shuffledOptions.forEach((opt, optIdx) => {
                optionsHTML += `
                    <button class="option-btn" data-correct="${opt.isCorrect}" onclick="checkAnswer(this, ${qIndex})">
                        <span class="option-letter">${letters[optIdx]}</span>
                        <span>${opt.text}</span>
                    </button>
                `;
            });

            const lessonBadge = q.lesson ? `<span class="badge badge-lesson">${q.lesson}</span>` : '';

            card.innerHTML = `
                <div class="q-meta">
                    <span class="badge badge-subject">${q.subject}</span>
                    ${lessonBadge}
                    <span class="badge badge-year">تجميعات ${q.year}</span>
                </div>
                <div class="q-text">${qIndex + 1}. ${q.question}</div>
                <div class="options-grid" id="options-${qIndex}">
                    ${optionsHTML}
                </div>
                <div class="explanation-box" id="exp-${qIndex}">
                    <strong>التوضيح العلمي:</strong> ${q.explanation}
                </div>
            `;
            container.appendChild(card);
        });
    }

    function checkAnswer(selectedBtn, qIndex) {
        const grid = document.getElementById(`options-${qIndex}`);
        const buttons = grid.querySelectorAll('.option-btn');
        const isCorrect = selectedBtn.getAttribute('data-correct') === 'true';

        answered++;
        if (isCorrect) {
            score++;
            selectedBtn.classList.add('correct');
        } else {
            selectedBtn.classList.add('wrong');
            buttons.forEach(btn => {
                if (btn.getAttribute('data-correct') === 'true') {
                    btn.classList.add('correct');
                }
            });
        }

        buttons.forEach(btn => btn.disabled = true);
        document.getElementById(`exp-${qIndex}`).classList.add('show');
        updateStats();
    }

    function updateStats() {
        document.getElementById('score').textContent = score;
        document.getElementById('answered').textContent = answered;
    }

    function filterQuestions(subject, btnElement) {
        currentSubject = subject;
        currentLesson = 'all';
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btnElement.classList.add('active');
        renderLessonButtons();
        renderQuestions();
    }

    function filterByLesson(lesson, btnElement) {
        currentLesson = lesson;
        document.querySelectorAll('.lesson-btn').forEach(b => b.classList.remove('active'));
        btnElement.classList.add('active');
        renderQuestions();
    }

    function resetQuiz() {
        renderQuestions();
    }
</script>
