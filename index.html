<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة أ. أحمد إمام | تحصيلي الأحياء وتدريبات الثانوي</title>
    <meta name="description" content="منصة تفاعلية لاختبارات تحصيلي الأحياء مع تجميعات السنوات السابقة وشروحات مبسطة لمناهج أحياء 1 وأحياء 2-1 وأحياء 2-2 وعلم البيئة.">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f766e;
            --primary-dark: #115e59;
            --primary-light: #ccfbf1;
            --secondary: #0369a1;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --success: #16a34a;
            --success-bg: #dcfce7;
            --danger: #dc2626;
            --danger-bg: #fee2e2;
            --border: #e2e8f0;
            --radius: 14px;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 2rem 1rem;
            text-align: center;
            box-shadow: 0 4px 12px rgba(15, 118, 110, 0.2);
        }

        header h1 {
            font-size: 1.9rem;
            font-weight: 800;
            margin-bottom: 0.4rem;
        }

        header p {
            font-size: 1.05rem;
            opacity: 0.92;
        }

        .container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .controls-card {
            background: var(--bg-card);
            padding: 1.25rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            justify-content: center;
            margin-bottom: 1rem;
        }

        .filter-btn {
            background: #f1f5f9;
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 0.55rem 1.2rem;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-btn:hover {
            background: var(--primary-light);
            color: var(--primary-dark);
        }

        .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 0.8rem;
            border-top: 1px solid var(--border);
            font-size: 0.95rem;
            color: var(--text-muted);
            font-weight: 700;
        }

        .stats-bar span strong {
            color: var(--primary);
            font-size: 1.1rem;
        }

        .reset-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 0.35rem 0.9rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .reset-btn:hover {
            background: #f1f5f9;
            color: var(--text-main);
        }

        .question-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 1.5rem;
            margin-bottom: 1.25rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .q-meta {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.9rem;
            flex-wrap: wrap;
        }

        .badge {
            font-size: 0.8rem;
            font-weight: 700;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
        }

        .badge-subject {
            background: var(--primary-light);
            color: var(--primary-dark);
        }

        .badge-year {
            background: #e0f2fe;
            color: var(--secondary);
        }

        .q-text {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 1.2rem;
            color: var(--text-main);
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.7rem;
        }

        @media (min-width: 640px) {
            .options-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .option-btn {
            text-align: right;
            background: #f8fafc;
            border: 2px solid var(--border);
            padding: 0.85rem 1rem;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background: #f0fdfa;
        }

        .option-btn:disabled {
            cursor: default;
        }

        .option-btn.correct {
            background: var(--success-bg);
            border-color: var(--success);
            color: #14532d;
            font-weight: 700;
        }

        .option-btn.wrong {
            background: var(--danger-bg);
            border-color: var(--danger);
            color: #7f1d1d;
            font-weight: 700;
        }

        .option-letter {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: white;
            border: 1px solid var(--border);
            font-weight: 700;
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        .explanation-box {
            margin-top: 1rem;
            padding: 1rem;
            background: #f0f9ff;
            border-right: 4px solid var(--secondary);
            border-radius: 8px;
            font-size: 0.95rem;
            color: #0c4a6e;
            display: none;
        }

        .explanation-box.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        footer {
            text-align: center;
            padding: 2rem 1rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<header>
    <h1>منصة أ. أحمد إمام للأحياء</h1>
    <p>تدريبات وتجميعات الاختبار التحصيلي للمرحلة الثانوية</p>
</header>

<div class="container">
    <div class="controls-card">
        <div class="filters">
            <button class="filter-btn active" onclick="filterQuestions('all', this)">الكل</button>
            <button class="filter-btn" onclick="filterQuestions('أحياء 1', this)">أحياء 1</button>
            <button class="filter-btn" onclick="filterQuestions('أحياء 2-1', this)">أحياء 2-1</button>
            <button class="filter-btn" onclick="filterQuestions('أحياء 2-2', this)">أحياء 2-2</button>
            <button class="filter-btn" onclick="filterQuestions('علم البيئة', this)">علم البيئة</button>
        </div>
        <div class="stats-bar">
            <span>النتيجة: <strong id="score">0</strong> / <strong id="answered">0</strong></span>
            <span>عدد الأسئلة المعروضة: <strong id="total-count">0</strong></span>
            <button class="reset-btn" onclick="resetQuiz()">إعادة المحاولة</button>
        </div>
    </div>

    <div id="questions-container"></div>
</div>

<footer>
    إعداد وتصميم: أ. أحمد إمام سليمان - معلم الأحياء للمرحلة الثانوية
</footer>

<script>
    const questionsBank = [
        {
            question: "أي من التالي يمثل الترتيب الصحيح لخطوات الطريقة العلمية؟",
            options: ["طرح السؤال، الفرضية، التجربة، تحليل البيانات", "الفرضية، طرح السؤال، التجربة، الاستنتاج", "التجربة، الفرضية، جمع البيانات، الاستنتاج", "طرح السؤال، التجربة، الفرضية، الاستنتاج"],
            correctIndex: 0,
            year: "1447",
            subject: "أحياء 1",
            explanation: "تبدأ الطريقة العلمية بالملاحظة وطرح السؤال، تليها صياغة الفرضية، ثم اختبارها بالتجربة وتجميع البيانات وتحليلها وصولاً للاستنتاج."
        },
        {
            question: "في تجربة لدراسة أثر الضوء على نمو النباتات، يُعد نمو النباتات الناتج عن كمية الضوء:",
            options: ["متغيراً تابعاً", "متغيراً مستقلاً", "مجموعة ضابطة", "ثابتاً تجريبياً"],
            correctIndex: 0,
            year: "1446",
            subject: "أحياء 1",
            explanation: "المتغير التابع هو العامل الذي ينتج عن المتغير المستقل (الضوء) ويعتمد عليه أثناء التجربة."
        },
        {
            question: "ما المصنف الذي يضم مجموعة من المخلوقات الحية المتشابهة في الشكل والتركيب والقادرة على التزاوج وإنتاج نسل خصب؟",
            options: ["النوع", "الجنس", "الفصيلة", "الرتبة"],
            correctIndex: 0,
            year: "1447",
            subject: "أحياء 1",
            explanation: "النوع هو أصغر مستويات التصنيف وأكثرها تحديداً، ويشترط قدرة أفراده على التزاوج وإنتاج نسل خصب."
        },
        {
            question: "أي من الممالك التالية يضم مخلوقات حقيقية النوى، غير ذاتية التغذي، وجدارها الخلوي مكون من الكايتين؟",
            options: ["الفطريات", "النباتات", "الطلائعيات", "البدائيات"],
            correctIndex: 0,
            year: "1446",
            subject: "أحياء 1",
            explanation: "تتميز مملكة الفطريات بوجود مادة الكايتين في جدارها الخلوي وهي مخلوقات حقيقية النوى غير ذاتية التغذي."
        },
        {
            question: "تُستخدم صبغة جرام في المختبرات الطبية لتحديد نوع الجدار الخلوي للبكتيريا؛ فإذا تلون الجدار باللون الوردي الفاتح فإن البكتيريا:",
            options: ["سالبة جرام وتحتوي كمية قليلة من الببتيدوجلايكان", "موجبة جرام وتحتوي طبقة سميكة من الببتيدوجلايكان", "بدائية تخلو من الببتيدوجلايكان تماماً", "مقاومة لجميع المضادات الحيوية"],
            correctIndex: 0,
            year: "1447",
            subject: "أحياء 1",
            explanation: "البكتيريا سالبة جرام تمتلك طبقة خارجية من الدهون وكمية قليلة من الببتيدوجلايكان فتظهر باللون الوردي الفاتح."
        },
        {
            question: "وجود بكتيريا إشيرشيا كولاي (E. coli) في عينات المياه يُعد مؤشراً على:",
            options: ["تلوث المياه بمياه الصرف الصحي", "نقاء المياه وصلاحيتها للشرب", "ارتفاع نسبة الأكسجين المذاب", "زيادة نسبة الأملاح المعدنية"],
            correctIndex: 0,
            year: "1445",
            subject: "أحياء 1",
            explanation: "تعيش بكتيريا إشيرشيا كولاي في أمعاء الإنسان وتُطرح مع الفضلات، لذا فوجودها في الماء يدل على تلوثه بمياه الصرف الصحي."
        },
        {
            question: "ما التركيب الذي يميز الفيروسات الارتجاعية مثل فيروس نقص المناعة المكتسبة (HIV)؟",
            options: ["وجود مادة RNA وإنزيم النسخ العكسي", "وجود مادة DNA مزدوجة الشريط", "قدرتها على التكاثر خارج خلايا العائل", "امتلاكها جداراً خلوياً من السليلوز"],
            correctIndex: 0,
            year: "1447",
            subject: "أحياء 1",
            explanation: "الفيروس الارتجاعي مادته الوراثية RNA ويستخدم إنزيم النسخ العكسي لتحويلها إلى DNA داخل خلية العائل."
        },
        {
            question: "أي من الطلائعيات التالية تُستخدم جدرها الخلوية المكونة من السيليكا في تلميع الأسنان والفلزات؟",
            options: ["الدياتومات", "السوطيات الدوارة", "اليوجلينات", "الهدبيات"],
            correctIndex: 0,
            year: "1446",
            subject: "أحياء 1",
            explanation: "تتكون جدر الدياتومات من مادة السيليكا القاسية، وعندما تموت تترسب في قاع المحيط وتُستخدم في تلميع الأسنان والفلزات."
        },
        {
            question: "تُعد الأشنات مؤشراً حيوياً مهماً في البيئة لأنها:",
            options: ["سريعة التأثر بملوثات الهواء وتدل على نقاء الجو", "تتكاثر بسرعة في البيئات شديدة التلوث", "تسبب أمراضاً تنفسية للإنسان", "تتطفل على جذور النباتات وتقتلها"],
            correctIndex: 0,
            year: "1447",
            subject: "أحياء 1",
            explanation: "المؤشر الحيوي مخلوق حساس للظروف البيئية المتغيرة، والأشنات تمتص الماء والغذاء من الهواء مباشرة فتتأثر سريعاً بالتلوث."
        },
        {
            question: "تتميز شعبة الإسفنجيات عن بقية شعب المملكة الحيوانية بأنها:",
            options: ["عديمة التناظر ولا تمتلك أنسجة أو أعضاء", "ذات تناظر شعاعي وتجويف معوي وعائي", "ذات تناظر جانبي وتجويف جسمي كاذب", "ثانوية الفم وحقيقية التجويف الجسمي"],
            correctIndex: 0,
            year: "1446",
            subject: "أحياء 1",
            explanation: "الإسفنجيات هي أبسط الحيوانات، وتتميز بأنها عديمة التناظر وتفتقر إلى الأنسجة والأعضاء والأجهزة."
        },
        {
            question: "أي من المخلوقات الحية التالية يُعد من المخلوقات حقيقية التجويف الجسمي وثانوية الفم؟",
            options: ["شوكيات الجلد والحبليات", "الرخويات والمفصليات", "الديدان الحلقية والديدان المفلطحة", "الديدان الأسطوانية والدوارات"],
            correctIndex: 0,
            year: "1447",
            subject: "أحياء 1",
            explanation: "شوكيات الجلد والحبليات هما الشعبتان الوحيدتان اللتان تتكون فيهما فتحة الشرج من أول فتحة في الجاسترولا (ثانوية الفم)."
        },
        {
            question: "أي من طوائف الديدان الأسطوانية التالية لا يمكن اكتشاف الإصابة بها عن طريق تحليل البراز؟",
            options: ["ديدان الفيلاريا", "ديدان الإسكارس", "الديدان الدبوسية", "الديدان الخطافية"],
            correctIndex: 0,
            year: "1446",
            subject: "أحياء 1",
            explanation: "تعيش ديدان الفيلاريا المسببة لداء الفيل في الجهاز الليمفي للإنسان وليس في القناة الهضمية، لذا لا تظهر في تحليل البراز."
        },
        {
            question: "تعتمد الرخويات سريعة الحركة كالأخطبوط والحبار في حركتها السريعة تحت الماء على:",
            options: ["الدفع النفاث عبر السيفون", "القدم العضلية للزحف", "الأقدام الأنبوبية", "الأهداب الخارجية"],
            correctIndex: 0,
            year: "1445",
            subject: "أحياء 1",
            explanation: "يسحب الأخطبوط والحبار الماء إلى تجويف العباءة ثم يضخه بقوة عبر أنبوب السيفون للاندفاع السريع."
        },
        {
            question: "يتم الإخراج والحفاظ على التوازن المائي في معظم المفصليات بواسطة أنابيب ملبيجي، باستثناء القشريات التي تستخدم:",
            options: ["النفريديا", "الخلايا اللهبية", "الفجوات المنقبضة", "القصبات الهوائية"],
            correctIndex: 0,
            year: "1447",
            subject: "أحياء 1",
            explanation: "تتخلص المفصليات من فضلاتها عبر أنابيب ملبيجي المتصلة بالأمعاء، بينما تستخدم القشريات النفريديا."
        },
        {
            question: "أي من الحشرات التالية يمر بتحول غير كامل (بيضة ← حورية ← حشرة بالغة)؟",
            options: ["الجراد", "الفراش", "النحل", "الخنفساء"],
            correctIndex: 0,
            year: "1447",
            subject: "أحياء 1",
            explanation: "التحول غير الكامل يمر بثلاث مراحل فقط دون مرحلة العذراء، ومن أمثلته الجراد والنمل الأبيض واليعسوب."
        }
    ];

    let currentFilter = 'all';
    let score = 0;
    let answered = 0;
    const letters = ['أ', 'ب', 'ج', 'د'];

    function shuffleArray(array) {
        const arr = array.map((item, idx) => ({ text: item, isCorrect: idx === 0 }));
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function renderQuestions() {
        const container = document.getElementById('questions-container');
        container.innerHTML = '';
        score = 0;
        answered = 0;
        updateStats();

        const filtered = currentFilter === 'all'
            ? questionsBank
            : questionsBank.filter(q => q.subject === currentFilter);

        document.getElementById('total-count').textContent = filtered.length;

        if (filtered.length === 0) {
            container.innerHTML = '<div class="question-card" style="text-align:center; color:var(--text-muted);">جاري إضافة أسئلة هذا المقرر قريباً...</div>';
            return;
        }

        filtered.forEach((q, qIndex) => {
            const card = document.createElement('div');
            card.className = 'question-card';

            const shuffledOptions = shuffleArray(q.options);

            let optionsHTML = '';
            shuffledOptions.forEach((opt, optIdx) => {
                optionsHTML += `
                    <button class="option-btn" data-correct="${opt.isCorrect}" onclick="checkAnswer(this, ${qIndex})">
                        <span class="option-letter">${letters[optIdx]}</span>
                        <span>${opt.text}</span>
                    </button>
                `;
            });

            card.innerHTML = `
                <div class="q-meta">
                    <span class="badge badge-subject">${q.subject}</span>
                    <span class="badge badge-year">تجميعات ${q.year}</span>
                </div>
                <div class="q-text">${qIndex + 1}. ${q.question}</div>
                <div class="options-grid" id="options-${qIndex}">
                    ${optionsHTML}
                </div>
                <div class="explanation-box" id="exp-${qIndex}">
                    <strong>التوضيح العلمي:</strong> ${q.explanation}
                </div>
            `;
            container.appendChild(card);
        });
    }

    function checkAnswer(selectedBtn, qIndex) {
        const grid = document.getElementById(`options-${qIndex}`);
        const buttons = grid.querySelectorAll('.option-btn');
        const isCorrect = selectedBtn.getAttribute('data-correct') === 'true';

        answered++;
        if (isCorrect) {
            score++;
            selectedBtn.classList.add('correct');
        } else {
            selectedBtn.classList.add('wrong');
            buttons.forEach(btn => {
                if (btn.getAttribute('data-correct') === 'true') {
                    btn.classList.add('correct');
                }
            });
        }

        buttons.forEach(btn => btn.disabled = true);
        document.getElementById(`exp-${qIndex}`).classList.add('show');
        updateStats();
    }

    function updateStats() {
        document.getElementById('score').textContent = score;
        document.getElementById('answered').textContent = answered;
    }

    function filterQuestions(subject, btnElement) {
        currentFilter = subject;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btnElement.classList.add('active');
        renderQuestions();
    }

    function resetQuiz() {
        renderQuestions();
    }

    renderQuestions();
</script>

</body>
</html>
